[package]
name = "biject"
version = "0.9.0"
edition = "2021"
description = "Schema-aware data and schema diff tool for CSV and SQL databases, with a Rust CLI and Tauri desktop UI"
license = "GPL-3.0-only"
repository = "https://github.com/vixinxiviir/biject"
homepage = "https://bijection.dev"
readme = "README.md"
keywords = ["diff", "schema", "database", "sql", "migration"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    # Desktop GUI ships via GitHub releases, not the crate
    "tauri-app/",
    # Distro packaging and CI are not consumer-facing
    "packaging/",
    ".github/",
    # Build settings for this repository's own releases. Cargo only reads a
    # config from the directory a command runs in and its ancestors, so a
    # published copy would never be read by anyone — it would just be baggage
    # that looks like it does something.
    ".cargo/",
    # Internal planning notes — must never be published
    "*-roadmap.md",
    # Specifications handed to implementers. Working documents about work not
    # yet done, which would go stale the moment it is. docs/licensing.md is
    # deliberately not excluded: that one is for users of the crate.
    "docs/specs/",
    # A snapshot of the public surface, taken to decide what to seal before 1.0.
    # Stale the moment anything changes, and about the project rather than for
    # users of the crate — same reason as the specs above.
    "docs/api-surface.md",
    # The plan for getting to 1.0. Same reason: about the project, not for
    # users of the crate, and stale the moment a step is done.
    "docs/road-to-1.0.md",
    # Generated attribution for bundled dependencies. Belongs with binaries,
    # not with source: a published snapshot goes stale as soon as a dependency
    # changes, and CI regenerates it for every release.
    "THIRD-PARTY-NOTICES.txt",
    # Local scratch, run output, and editor/tooling state
    "outputs-*/",
    "myresults",
    "source.csv",
    "target.csv",
    ".venv/",
    ".vscode/",
    ".continue/",
    ".aider*",
]

[[bin]]
name = "biject"
path = "src/main.rs"

[lib]
name = "biject"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
polars = { version = "0.39", features = ["lazy", "csv", "parquet", "streaming", "timezones", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
colored = "2"
anyhow = "1"
prettytable = "0.10.0"
chrono = "0.4"
tiberius = { version = "0.12", features = ["tds73"] }
# Driving tiberius' query stream far enough to read its column metadata, which
# is the only way to learn a result set's shape when it returns no rows.
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# NUMERIC has no native Rust mapping in tokio-postgres, so without this the
# column decodes as null and every decimal value silently vanishes from the
# diff. Already in the tree via mysql_async; this only adds the FromSql impl.
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
mysql_async = "0.34"
keyring = "3"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# column_decltype exposes each result column's declared type, which is how the
# SQLite connector recovers a column's intended type for typing and schema diffs.
rusqlite = { version = "0.31", features = ["column_decltype"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }