[package]
name = "biject"
version = "0.4.0"
edition = "2021"
description = "Schema-aware data and schema diff tool for CSV and SQL databases, with a Rust CLI and Tauri desktop UI"
license = "GPL-3.0-only"
repository = "https://github.com/vixinxiviir/biject"
homepage = "https://bijection.dev"
readme = "README.md"
keywords = ["diff", "schema", "database", "sql", "migration"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    # Desktop GUI ships via GitHub releases, not the crate
    "tauri-app/",
    # Distro packaging and CI are not consumer-facing
    "packaging/",
    ".github/",
    # Internal planning notes — must never be published
    "*-roadmap.md",
    # Local scratch, run output, and editor/tooling state
    "outputs-*/",
    "myresults",
    "source.csv",
    "target.csv",
    ".venv/",
    ".vscode/",
    ".continue/",
    ".aider*",
]

[[bin]]
name = "biject"
path = "src/main.rs"

[lib]
name = "biject"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
polars = { version = "0.39", features = ["lazy", "csv", "parquet", "streaming"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
colored = "2"
anyhow = "1"
prettytable = "0.10.0"
chrono = "0.4"
tiberius = { version = "0.12", features = ["tds73"] }
tokio = { version = "1", features = ["rt", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
mysql_async = "0.34"
keyring = "3"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = "0.31"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }