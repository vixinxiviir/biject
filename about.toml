# Configuration for `cargo about`, which generates THIRD-PARTY-NOTICES.txt.
#
# Nearly every permissive licence here requires that the copyright notice and
# licence text accompany binary redistribution, so the generated file ships
# alongside every binary artifact. See docs/licensing.md.

# Licences we are prepared to distribute under. A dependency whose licence is
# not listed makes the generation fail, which is the point: it forces a decision
# rather than silently shipping something unvetted.
#
# Ordering matters for dependencies offering a choice — the first match wins,
# so permissive terms are selected ahead of anything weaker.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # File-level copyleft. Permitted because MPL-2.0 does not extend to the
    # combined work: it requires the covered files stay under the MPL and that
    # recipients can obtain their source, which this notices file provides.
    # Reached via colored, option-ext (dirs) and smartstring (polars).
    "MPL-2.0",
    # Covers this crate itself, not a dependency.
    "GPL-3.0-only",
]

# The workspace crate is our own code, covered by LICENSE rather than by a
# third-party notice.
ignore-build-dependencies = true
ignore-dev-dependencies = true

[biject]
# Our own crate is covered by LICENSE, not by a third-party notice.
accepted = ["GPL-3.0-only"]

# polars-arrow-format ships its licence as a file rather than declaring an SPDX
# expression, so cargo-about cannot classify it automatically. The file is the
# Apache 2.0 text verbatim; the checksum pins that, so if upstream ever swaps
# the licence the generation fails rather than silently asserting the old one.
[polars-arrow-format]
accepted = ["Apache-2.0"]

[polars-arrow-format.clarify]
license = "Apache-2.0"

[[polars-arrow-format.clarify.files]]
path = "LICENSE"
checksum = "0b814d8f72dff90d0f0fef5e8c8c22aa7639311cfdb53050fce50ea34a30117b"
