name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # apt must never wait on a prompt. Without this, a package that wants to ask
  # about a config file blocks until the job's timeout rather than failing.
  DEBIAN_FRONTEND: noninteractive
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step should fail in minutes, not sit until GitHub's six-hour
    # default. A healthy cold run is well under this; a warm one is minutes.
    # Raised from 45 when SQL Server joined the services: its image is well
    # over 2GB and the pull runs before any step does.
    timeout-minutes: 60

    # Every connector defect found in this project was invisible to a passing
    # unit-test suite and obvious against a real database. The integration
    # tests are #[ignore] so they never run by accident; here they always do.
    #
    # All three engines run here, not just PostgreSQL. Each connector reads
    # rules from a different set of system views — pg_constraint and pg_index,
    # TABLE_CONSTRAINTS with STATISTICS, sys.indexes — and a fixture built by
    # hand proves nothing about what those views really return.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bijecttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: bijecttest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # No equivalent of POSTGRES_DB or MYSQL_DATABASE here, so the test
      # creates its own database on first connection. That keeps the suite
      # runnable against nothing but a server and a URL — no sqlcmd on the
      # machine and no setup step to forget.
      #
      # More retries than the others: SQL Server takes appreciably longer to
      # accept connections after the container starts.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libgtk-3-dev \
            libsqlite3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            librsvg2-dev \
            pkg-config \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches the registry and both target directories. Without it every step
      # below recompiles the whole tree, and this tree contains polars.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tauri-app/src-tauri

      - name: Prefetch Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      # Runs on every push, PR, and release tag. A failure here blocks the
      # linux-artifacts job, so a release cannot be cut on a red test suite.
      #
      # There is deliberately no separate `cargo check` for this crate: the test
      # build compiles everything a check would, and the two share almost no
      # artifacts, so running both meant compiling the tree twice for nothing.
      - name: Test CLI crate
        run: cargo test --frozen --locked --all-targets

      # The Tauri crate has no tests, so this is what proves it still compiles.
      - name: Check Tauri app crate
        run: cargo check --frozen --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      # Cheap, and it keeps the tree formatted now that it has been done once.
      # Without this the next person to run `cargo fmt` gets a diff across the
      # whole repository mixed into whatever they were actually changing.
      #
      # Linux only. Formatting is a property of the source, not of the platform,
      # so running it three times would just fail three times.
      - name: Check formatting
        run: cargo fmt --check

      # Denies new lints while grandfathering three that already fire across the
      # existing code. too_many_arguments in particular would mean reshaping
      # public signatures, which is not worth doing for a lint.
      - name: Lint
        run: |
          cargo clippy --frozen --locked --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::needless_range_loop \
            -A clippy::match_ref_pats

      # Seeds its own fixtures, so there is no SQL file or psql dependency.
      - name: Test against a real PostgreSQL
        env:
          BIJECT_TEST_PG: postgres://postgres:test@localhost:5432/bijecttest
        run: cargo test --frozen --locked --test catalog_postgres -- --ignored

      # These panic rather than skip when their variable is unset, so a
      # mistyped name here fails the job instead of quietly testing nothing.
      - name: Test against a real MySQL and SQL Server
        env:
          BIJECT_TEST_MYSQL: mysql://root:test@localhost:3306/bijecttest
          BIJECT_TEST_MSSQL: sqlserver://sa:Str0ng!Passw0rd@localhost:1433/bijecttest
        run: cargo test --frozen --locked --test catalog_rules -- --ignored

      - name: Validate desktop entry
        run: desktop-file-validate packaging/aur/biject.desktop


  # macOS and Windows get their own job rather than joining `check` in a matrix,
  # because `services:` only works on Linux runners: they are Docker containers,
  # and neither the macOS nor the Windows runner can host a Linux one. The live
  # database suites therefore stay above, on Linux, where they always run.
  #
  # What is left is still worth running on both. Three of the four connectors
  # compile differently off Linux — rusqlite switches to bundled SQLite, and
  # keyring switches to Credential Manager and Keychain — so "it builds on
  # Linux" says nothing about whether it builds at all here.
  check-portable:
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    defaults:
      run:
        # The Windows runner's default shell is PowerShell, which does not
        # understand `\` line continuations: it passes the backslash to cargo as
        # an argument and then tries to run `-D warnings` as a command. Git Bash
        # ships on every runner, so one script works on all three platforms.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tauri-app/src-tauri
          # Without this the two matrix legs share one cache key and fight over
          # it, and the loser recompiles polars from scratch every run.
          key: ${{ matrix.os }}

      - name: Prefetch Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      # The #[ignore]d suites are skipped here for want of a server, which is
      # the point of them being ignored. Everything else runs.
      - name: Test CLI crate
        run: cargo test --frozen --locked --all-targets

      - name: Check Tauri app crate
        run: cargo check --frozen --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      - name: Lint
        run: |
          cargo clippy --frozen --locked --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::needless_range_loop \
            -A clippy::match_ref_pats

  linux-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libgtk-3-dev \
            libsqlite3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tauri-app/src-tauri

      - name: Prefetch Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      - name: Create vendor archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo vendor --locked --versioned-dirs vendor --sync tauri-app/src-tauri/Cargo.toml > /tmp/vendor-config.toml
          mkdir -p dist
          tar --zstd -cf "dist/biject-vendor-${VERSION}.tar.zst" vendor

      # Installed as a prebuilt binary. Building cargo-about from source added
      # its entire dependency tree to every release for a tool that runs once.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Regenerated rather than trusting the committed copy, so a dependency
      # added without re-running cargo-about cannot ship stale attribution.
      # Fails the release if any dependency licence is not in about.toml.
      - name: Generate third-party notices
        run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt

      - name: Build CLI binary
        run: cargo build --frozen --release --locked --bin biject

      - name: Build desktop binary
        run: cargo build --frozen --release --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      - name: Stage release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/biject dist/
          cp tauri-app/src-tauri/target/release/biject-gui dist/
          cp packaging/aur/biject.desktop dist/
          cp packaging/aur/PKGBUILD dist/
          cp packaging/aur/.SRCINFO dist/
          cp LICENSE dist/
          cp THIRD-PARTY-NOTICES.txt dist/
          curl -L -o "dist/biject-${VERSION}.tar.gz" "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          (
            cd dist
            sha256sum "biject-${VERSION}.tar.gz" "biject-vendor-${VERSION}.tar.zst" > aur-sha256sums.txt
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biject-linux-${{ github.ref_name }}
          path: dist/

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # The same binaries for the platforms that have no distro packaging. Separate
  # from linux-artifacts because almost none of that job transfers: the vendor
  # archive, PKGBUILD, .SRCINFO and the desktop entry are all AUR-specific, and
  # the AUR only ships Linux.
  mac-windows-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, check-portable]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        # The Windows runner's default shell is PowerShell, where none of the
        # scripts below parse. Git Bash ships on every runner, so one script
        # works on all three platforms rather than needing a PowerShell twin.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A Mac sold today is Apple Silicon and the runner matches, so an
      # unqualified build produces an arm64 binary that will not start on an
      # Intel Mac. Both are built and merged below into one file that runs on
      # either, which is also what makes the result testable in an x86 VM.
      - name: Add the Intel macOS target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tauri-app/src-tauri
          key: ${{ matrix.os }}-release

      - name: Prefetch Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tauri-app/src-tauri/Cargo.toml

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Regenerated per platform rather than copied from the Linux job. The
      # dependency tree genuinely differs — rusqlite bundles SQLite here, and
      # keyring pulls a different backend — so Linux's notices would be wrong
      # for these binaries. If this step fails, a crate that only builds on this
      # platform has a licence nobody has reviewed, which is worth knowing.
      - name: Generate third-party notices
        run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt

      - name: Build CLI binary
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --frozen --release --locked --bin biject --target aarch64-apple-darwin
            cargo build --frozen --release --locked --bin biject --target x86_64-apple-darwin
          else
            cargo build --frozen --release --locked --bin biject
          fi

      - name: Build desktop binary
        run: |
          MANIFEST=tauri-app/src-tauri/Cargo.toml
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --frozen --release --locked --manifest-path "$MANIFEST" --target aarch64-apple-darwin
            cargo build --frozen --release --locked --manifest-path "$MANIFEST" --target x86_64-apple-darwin
          else
            cargo build --frozen --release --locked --manifest-path "$MANIFEST"
          fi

      # These are plain executables, not a .app bundle or an .msi. That matches
      # what the Linux job has always shipped, and keeps this change to one
      # thing. Bundling needs the Tauri CLI and is worth doing separately.
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # lipo merges the two architectures into one universal binary.
            lipo -create -output dist/biject \
              target/aarch64-apple-darwin/release/biject \
              target/x86_64-apple-darwin/release/biject
            lipo -create -output dist/biject-gui \
              tauri-app/src-tauri/target/aarch64-apple-darwin/release/biject-gui \
              tauri-app/src-tauri/target/x86_64-apple-darwin/release/biject-gui
            lipo -info dist/biject dist/biject-gui
          else
            cp target/release/biject.exe dist/
            cp tauri-app/src-tauri/target/release/biject-gui.exe dist/
          fi
          cp LICENSE dist/
          cp THIRD-PARTY-NOTICES.txt dist/
          (cd dist && sha256sum * > sha256sums.txt)
          cat dist/sha256sums.txt

      # Proves the thing that was just built actually starts. A binary that
      # links but cannot run is exactly what a cross-platform build produces
      # when a system library is missing, and it would otherwise be found by
      # whoever downloaded it.
      - name: Smoke-test the CLI
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./dist/biject --version
            ./dist/biject schema --source examples/customers_v1.csv --target examples/customers_v2.csv
          else
            ./dist/biject.exe --version
            ./dist/biject.exe schema --source examples/customers_v1.csv --target examples/customers_v2.csv
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biject-${{ matrix.name }}-${{ github.ref_name }}
          path: dist/

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
